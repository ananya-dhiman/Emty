<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Emty — keep it emty</title>
    <meta
      name="description"
      content="Emty ranks your Gmail by what actually needs your attention and keeps sensitive email on your own machine. Local-first desktop app for Windows and macOS."
    />
    <meta name="theme-color" content="#050505" />

    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Link previews (Twitter/X, LinkedIn, Slack, Discord).
         og:image must be an absolute URL. This points at the copy committed to
         the repo so the card renders no matter where the site is hosted; once
         the site has its own domain, swap both URLs below for
         https://<your-domain>/og-image.png and https://<your-domain>/ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Emty" />
    <meta property="og:title" content="Emty — keep it emty" />
    <meta
      property="og:description"
      content="Reads everything. Bothers you with nothing. Local-first Gmail triage with AI that stays on your machine."
    />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/ananya-dhiman/Emty/main/brand/social-a-dark.png"
    />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="Emty — keep it emty" />
    <meta property="og:url" content="https://github.com/ananya-dhiman/Emty" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Emty — keep it emty" />
    <meta
      name="twitter:description"
      content="Reads everything. Bothers you with nothing. Local-first Gmail triage with AI that stays on your machine."
    />
    <meta
      name="twitter:image"
      content="https://raw.githubusercontent.com/ananya-dhiman/Emty/main/brand/social-a-dark.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
