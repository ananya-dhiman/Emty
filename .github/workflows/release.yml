name: Release

# Releases are a deliberate act, not a side effect of merging.
# Pushing a v* tag is the trigger; workflow_dispatch is the manual escape hatch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Least privilege: this workflow may write releases and nothing else.
permissions:
  contents: write

jobs:
  build:
    strategy:
      # A failing Intel/Windows leg must not cancel its siblings — we want to
      # know whether a break is platform-specific or global.
      fail-fast: false
      matrix:
        include:
          - platform: macos-14              # Apple Silicon
            target: aarch64-apple-darwin
            bundle: dmg
            ext: dmg
            alias: Emty-macos-aarch64.dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            ext: exe
            alias: Emty-windows-x64-setup.exe

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # The committed lockfiles were written by npm 11; Node 20 ships npm 10,
      # which resolves a different tree from the same package.json and rejects
      # them ("Missing: gcp-metadata@... from lock file"). Pin so CI and local
      # use the same resolver. Note a local `npm ci --dry-run` does NOT catch
      # this — it passes even when CI fails.
      - name: Pin npm to match the committed lockfiles
        shell: bash
        run: npm i -g npm@11.10.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Caches ~/.cargo and src-tauri/target — turns a ~15 min Rust build
      # into a few minutes on subsequent runs.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      # Sidecars (node ~67MB, ollama ~30MB) are pinned by version constants
      # inside the download scripts, so key the cache on those files.
      - uses: actions/cache@v4
        with:
          path: frontend/src-tauri/binaries
          key: sidecars-${{ matrix.target }}-${{ hashFiles('frontend/scripts/download-*.mjs') }}

      # The packaged app loads backend/dist/.env at runtime (backend/src/env.ts)
      # and index.ts exits(1) if it cannot reach Mongo, so a build without real
      # values produces an installer whose sidecar dies silently on launch.
      # backend/.env is gitignored, hence the secret. Passed via env: rather
      # than interpolated into the run: body so the value never appears in the
      # rendered shell command.
      - name: Write backend .env
        shell: bash
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
        run: |
          if [ -z "$BACKEND_ENV" ]; then
            echo "::error::BACKEND_ENV secret is empty or unset. The build would produce an app whose backend exits on launch. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$BACKEND_ENV" > backend/.env
          echo "wrote backend/.env ($(wc -l < backend/.env) lines)"

      # frontend/.env is gitignored too. Vite substitutes import.meta.env.VITE_*
      # at BUILD time, so without this every value becomes `undefined` and
      # utils/firebase.ts:16 (getAuth at module scope) throws auth/invalid-api-key
      # before React mounts — the app opens to a white screen on every window.
      #
      # Unlike BACKEND_ENV these are not secrets: the Firebase *web* config
      # (apiKey, authDomain, appId) is public by design and ships in every
      # Firebase client, protected by Security Rules rather than secrecy. It
      # lives in a secret here only because the file is gitignored.
      - name: Write frontend .env
        shell: bash
        env:
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
        run: |
          if [ -z "$FRONTEND_ENV" ]; then
            echo "::error::FRONTEND_ENV secret is empty or unset. The build would produce an app that opens to a white screen (Firebase init throws with undefined config). Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$FRONTEND_ENV" > frontend/.env
          echo "wrote frontend/.env ($(grep -c 'VITE_' frontend/.env) VITE_ vars)"

      # npm ci, not npm install: install the lockfile exactly and fail loudly
      # if it disagrees with package.json, rather than silently re-resolving.
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # TEMPORARY diagnostic - delete this step once signing works.
      # Prints only non-secret facts: lengths, the first/last 4 characters, and
      # the decoded comment line (a fixed public string). The key body is never
      # printed. This exists because "Missing comment in secret key" means the
      # value CI receives is not the key file contents, and we cannot see it.
      - name: Diagnose signing secret
        shell: bash
        env:
          K: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          P: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "key length : ${#K}   (expected 348)"
          echo "key first4 : ${K:0:4}   (expected dW50)"
          echo "key last4  : ${K: -4}   (expected Cg==)"
          echo "pw  length : ${#P}"
          if printf %s "$K" | base64 -d > dec.tmp 2>/dev/null; then
            echo "base64     : decodes OK"
            echo "line count : $(wc -l < dec.tmp)   (expected 1)"
            echo "line1      : $(head -1 dec.tmp)"
            echo "line2 chars: $(sed -n 2p dec.tmp | wc -c)   (expected 213)"
          else
            echo "base64     : FAILED TO DECODE - value is not valid base64"
          fi
          rm -f dec.tmp

      # beforeBuildCommand in tauri.conf.json builds the backend and fetches
      # the host-matching sidecars, so no extra steps are needed here.
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update payloads. With createUpdaterArtifacts enabled and a
          # pubkey in tauri.conf.json, Tauri REQUIRES the private key: without it the
          # build fails outright ("A public key has been found, but no private key")
          # rather than quietly shipping unsigned artifacts. Verified locally.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: Emty ${{ github.ref_name }}
          releaseDraft: true        # human gate — nothing is live until you publish
          prerelease: false

      # Tauri embeds the version in its filenames (Emty_1.2.0_x64-setup.exe),
      # but /releases/latest/download/ matches on an exact name. Upload a second
      # copy under a fixed name so the landing page can link to it forever.
      - name: Upload version-less alias
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dir="frontend/src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}"
          src=$(ls "$dir"/*.${{ matrix.ext }} | head -1)
          echo "Aliasing $src -> ${{ matrix.alias }}"
          cp "$src" "${{ matrix.alias }}"
          gh release upload "${{ github.ref_name }}" "${{ matrix.alias }}" --clobber
